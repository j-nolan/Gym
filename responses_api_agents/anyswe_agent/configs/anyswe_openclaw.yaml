anyswe_openclaw:
  responses_api_agents:
    anyswe_agent:
      entrypoint: app.py
      domain: coding
      description: SWE-bench run by OpenClaw natively inside the task container.
      value: Eval software engineering capabilities on SWE-bench with any Gym agent.

      agent_server_module: responses_api_agents.openclaw_agent.app
      agent_server_class: OpenClawAgent
      agent_config_class: OpenClawAgentConfig
      agent_kwargs:
        model: nvinf/nvidia/nvidia/nemotron-3-ultra
        timeout: 1800
        setup_timeout: 300
        thinking: "off"
        # Run OpenClaw's transient workspace off /testbed so it never pollutes the graded git diff.
        # Trace persistence is handled by the agent pointing HOME at the mounted /trajectories_mount
        # dir (see openclaw_agent/app.py) -- do NOT set OPENCLAW_STATE_DIR, it breaks config loading.
        workspace_root: /tmp/openclaw_ws
        system_prompt: "You are fixing a bug in the repository at /testbed. Use your tools to inspect and edit the source files. Make the minimal correct code change, run relevant checks if practical, and leave the final fix applied in /testbed."
        openclaw_config:
          agents:
            defaults:
              workspace: /testbed
          tools:
            profile: coding
          models:
            providers:
              nvinf:
                api: openai-completions
                baseUrl: ${policy_base_url}
                apiKey: ${policy_api_key}
                # Provider idle (no-response) timeout. nemotron-3-ultra can be slow to first token
                # under load; the 120s default aborts mid-run. 900s rides out slow responses
                # (the endpoint's silent stalls are the known bottleneck -- also run low concurrency).
                timeoutSeconds: 900
                models:
                - id: azure/openai/gpt-5.4
                  name: azure/openai/gpt-5.4
                  api: openai-completions
                - id: nvidia/qwen/qwen3.6-35b-a3b
                  name: nvidia/qwen/qwen3.6-35b-a3b
                  api: openai-completions
                - id: nvidia/nvidia/nemotron-3-ultra
                  name: nvidia/nvidia/nemotron-3-ultra
                  api: openai-completions
                - id: nvidia/moonshotai/kimi-k2.6
                  name: nvidia/moonshotai/kimi-k2.6
                  api: openai-completions
                - id: aws/anthropic/bedrock-claude-opus-4-7
                  name: aws/anthropic/bedrock-claude-opus-4-7
                  api: openai-completions

      # docker:// => EnrootProvider imports each image to a cached .sqsh on first use.
      # For pre-staged local images instead, point this at an ABSOLUTE dir of raw-id-named
      # squashes, e.g. /path/to/sqsh/{instance_id}.sqsh -- anyswe only treats a formatter as a
      # local image when it ends in .sif or starts with '/' or '.', so the path must be absolute.
      container_formatter: docker://swebench/sweb.eval.x86_64.{instance_id}
      sandbox_provider: {enroot: {}}
      swebench_agent_timeout: 2100
      swebench_tests_timeout: 1800
      concurrency: 2

      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/anyswe_agent/data/example.jsonl
